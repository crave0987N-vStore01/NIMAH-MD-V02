<!DOCTYPE html>
<!-- NIMAH MD — © 2026 Nimah Dev. All Rights Reserved. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1eee8">
<title>NIMAH MD — Admin</title>
<link rel="icon" href="/logo.jpg">
<link rel="stylesheet" href="/nimah.css">
</head>
<body>
<div class="bg"></div><div class="grain"></div>

<main class="shell" id="loginBox">
  <header class="mast reveal">
    <div class="plate"><img src="/logo.jpg" alt="NIMAH MD"></div>
    <h1 class="display">Back of<br><em>house.<svg viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M2 6 C 30 1, 55 9, 90 4 S 160 8, 198 3"/></svg></em></h1>
  </header>
  <section class="sheet reveal d1">
    <i class="cm-a"></i><i class="cm-b"></i>
    <div class="kicker">Admin sign in</div>
    <label class="f" for="pwInput">Password</label>
    <input class="in" type="password" id="pwInput" placeholder="Admin password" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">Enter</button>
    <div class="msg err" id="loginErr"></div>
    <p class="hint" style="text-align:left">Five wrong attempts lock this address for five minutes.</p>
  </section>
</main>

<main class="shell wide" id="dash" style="display:none">
  <div class="topbar reveal">
    <div class="brandmark">Nimah <b>MD</b> <span class="stamp" style="margin-left:10px">admin</span></div>
    <button class="btn ghost sm" onclick="logout()">Sign out</button>
  </div>
  <p class="lede reveal d1" style="max-width:none">Every bot paired through this deployment, in one place.</p>

  <div class="stats four reveal d1" id="statStrip"></div>

  <section class="sec reveal d2">
    <div class="sec-h"><span class="no">01</span><h2>Paired bots</h2><span class="note">refreshes every 8s</span></div>
    <div id="sessionList"></div>
  </section>

  <div class="grid2">
    <section class="sec reveal d3">
      <div class="sec-h"><span class="no">02</span><h2>Send a message</h2></div>
      <div class="sheet"><i class="cm-a"></i><i class="cm-b"></i>
        <label class="f" for="bSession" style="margin-top:0">From bot</label>
        <select class="in" id="bSession"></select>
        <label class="f" for="bJid">To (chat id)</label>
        <input class="in" type="text" id="bJid" placeholder="94771234567@s.whatsapp.net">
        <label class="f" for="bText">Message</label>
        <textarea class="in" id="bText" placeholder="Type your message"></textarea>
        <button class="btn" onclick="sendBroadcast()">Send</button>
        <div class="msg" id="broadcastMsg"></div>
      </div>
    </section>

    <section class="sec reveal d3">
      <div class="sec-h"><span class="no">03</span><h2>Custom commands</h2><span class="note">no code</span></div>
      <div class="sheet"><i class="cm-a"></i><i class="cm-b"></i>
        <label class="f" for="ccName" style="margin-top:0">Command name (no dot)</label>
        <input class="in" type="text" id="ccName" placeholder="rules">
        <label class="f" for="ccReply">Reply text</label>
        <textarea class="in" id="ccReply" placeholder="What the bot says when someone sends this command"></textarea>
        <button class="btn" onclick="addCustomCommand()">Add command</button>
        <div class="msg" id="ccMsg"></div>
        <div id="ccList"></div>
      </div>
    </section>
  </div>

  <section class="sec reveal d4">
    <div class="sec-h"><span class="no">04</span><h2>Command index</h2><span class="note">per section</span></div>
    <div class="bars" id="bars"></div>
  </section>

  <p class="foot">Crafted by <b>Nimah Dev</b></p>
</main>

<script>
let adminToken = localStorage.getItem('nimah_admin_token') || '';
let timer = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => { const d = document.createElement('div'); d.innerText = s == null ? '' : s; return d.innerHTML; };
function adminFetch(url, opts) { opts = opts || {}; opts.headers = Object.assign({ 'x-admin-token': adminToken, 'Content-Type': 'application/json' }, opts.headers || {}); return fetch(url, opts); }
function setMsg(el, text, kind) { el.className = 'msg' + (kind ? ' ' + kind : ''); el.innerText = text; }

async function doLogin() {
  const err = $('loginErr'); err.innerText = '';
  try {
    const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pwInput').value }) });
    const d = await r.json();
    if (!r.ok) { err.innerText = d.error || 'Login failed.'; return; }
    adminToken = d.token; localStorage.setItem('nimah_admin_token', adminToken); showDash();
  } catch (e) { err.innerText = 'Server connection error.'; }
}
function showDash() { $('loginBox').style.display = 'none'; $('dash').style.display = 'block'; refreshAll(); clearInterval(timer); timer = setInterval(refreshAll, 8000); }
async function refreshAll() { await Promise.all([refreshStats(), refreshSessions(), refreshCustomCommands()]); }

async function refreshStats() {
  const r = await adminFetch('/api/admin/stats'); if (r.status === 401) return logout();
  const d = await r.json();
  $('statStrip').innerHTML =
    `<div class="stat"><b>${d.active}</b><span>Online now</span></div>` +
    `<div class="stat"><b>${d.total}</b><span>Sessions</span></div>` +
    `<div class="stat"><b>${d.commands}</b><span>Commands</span></div>` +
    `<div class="stat"><b>${d.memoryMb}<small style="font-size:14px"> MB</small></b><span>Memory</span></div>`;
  const cats = d.categories || {}, max = Math.max(1, ...Object.values(cats));
  $('bars').innerHTML = Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    `<div class="bar"><span>${esc(k)}</span><i style="width:${Math.max(4, (v / max) * 100)}%"></i><em>${v}</em></div>`).join('');
}

async function refreshSessions() {
  const r = await adminFetch('/api/admin/sessions'); if (r.status === 401) return logout();
  const d = await r.json();
  const list = $('sessionList'), sel = $('bSession');
  if (!d.sessions.length) { list.innerHTML = '<div class="empty">No bots paired yet. Share the pairing link to get started.</div>'; sel.innerHTML = '<option value="">No bots available</option>'; return; }
  const focused = document.activeElement && document.activeElement.id;
  if (focused && focused.indexOf('label-') === 0) { /* don't clobber typing */ } else {
    list.innerHTML = d.sessions.map(s => `
      <div class="bot">
        <div class="bot-top">
          <span class="dot ${s.connected ? 'on' : 'off'}"></span>
          <div><div class="nm">${s.label ? esc(s.label) : 'Unnamed bot'}</div><div class="id">${esc(s.id)}</div></div>
          <button class="btn ghost sm" onclick="restartSession('${esc(s.id)}')">Restart</button>
        </div>
        <div class="bot-row"><input class="in" type="text" maxlength="40" placeholder="Label this bot" value="${s.label ? esc(s.label) : ''}" id="label-${esc(s.id)}"><button class="btn ghost sm" onclick="saveLabel('${esc(s.id)}')">Save</button></div>
        <div class="chips">
          <span class="chip ${s.autoStatus.view ? 'active' : ''}" onclick="toggleAuto('${esc(s.id)}','view',${!s.autoStatus.view})">Status view</span>
          <span class="chip ${s.autoStatus.react ? 'active' : ''}" onclick="toggleAuto('${esc(s.id)}','react',${!s.autoStatus.react})">Status react ${esc(s.autoStatus.emoji)}</span>
        </div>
      </div>`).join('');
  }
  const cur = sel.value;
  sel.innerHTML = d.sessions.map(s => `<option value="${esc(s.id)}">${s.label ? esc(s.label) : esc(s.id.slice(0, 8))} (${s.connected ? 'online' : 'offline'})</option>`).join('');
  if (cur) sel.value = cur;
}
async function toggleAuto(id, field, value) { await adminFetch('/api/admin/sessions/' + id + '/autostatus', { method: 'POST', body: JSON.stringify({ [field]: value }) }); refreshSessions(); }
async function saveLabel(id) { await adminFetch('/api/admin/sessions/' + id + '/label', { method: 'POST', body: JSON.stringify({ label: $('label-' + id).value }) }); document.activeElement.blur(); refreshSessions(); }
async function restartSession(id) { if (!confirm('Restart this bot? It will briefly disconnect.')) return; await adminFetch('/api/admin/sessions/' + id + '/restart', { method: 'POST' }); refreshSessions(); }

async function sendBroadcast() {
  const el = $('broadcastMsg'); setMsg(el, 'Sending');
  try {
    const r = await adminFetch('/api/admin/broadcast', { method: 'POST', body: JSON.stringify({ sessionId: $('bSession').value, jid: $('bJid').value.trim(), text: $('bText').value.trim() }) });
    const d = await r.json();
    if (!r.ok) return setMsg(el, d.error || 'Failed to send.', 'err');
    setMsg(el, 'Sent', 'ok'); $('bText').value = '';
  } catch (e) { setMsg(el, 'Server connection error.', 'err'); }
}

async function refreshCustomCommands() {
  const r = await adminFetch('/api/admin/custom-commands'); if (r.status === 401) return logout();
  const d = await r.json();
  $('ccList').innerHTML = d.commands.length ? '<hr class="rule">' + d.commands.map(c => `
    <div class="cc"><code>.${esc(c.name)}</code><span>${esc(c.reply.slice(0, 80))}${c.reply.length > 80 ? '…' : ''}</span>
    <button class="btn ghost sm danger" onclick="deleteCustomCommand('${esc(c.name)}')">Delete</button></div>`).join('') : '';
}
async function addCustomCommand() {
  const el = $('ccMsg'); setMsg(el, 'Adding');
  try {
    const r = await adminFetch('/api/admin/custom-commands', { method: 'POST', body: JSON.stringify({ name: $('ccName').value.trim(), reply: $('ccReply').value.trim() }) });
    const d = await r.json();
    if (!r.ok) return setMsg(el, d.error || 'Failed to add.', 'err');
    setMsg(el, 'Added .' + d.name, 'ok'); $('ccName').value = ''; $('ccReply').value = ''; refreshCustomCommands();
  } catch (e) { setMsg(el, 'Server connection error.', 'err'); }
}
async function deleteCustomCommand(name) { if (!confirm('Delete .' + name + '?')) return; await adminFetch('/api/admin/custom-commands/' + name, { method: 'DELETE' }); refreshCustomCommands(); }

async function logout() { try { await adminFetch('/api/admin/logout', { method: 'POST' }); } catch (e) {} localStorage.removeItem('nimah_admin_token'); location.reload(); }
$('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
if (adminToken) showDash();
</script>
</body>
</html>
