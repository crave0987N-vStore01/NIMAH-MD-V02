<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>NIMAH MD — Admin Panel</title>
    <link rel="icon" href="https://i.ibb.co/21PLPr29/file-00000000019082118137012f9eb9753e.png">
    <link rel="preload" as="image" href="/bg.jpg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #060402; color: #f3e6cf; min-height: 100vh; overflow-x: hidden; position: relative;
        }
        .backdrop {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(180deg, rgba(6,4,2,0.62) 0%, rgba(6,4,2,0.9) 65%, #060402 100%), url('/bg.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glow { position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; opacity: 0.45; pointer-events: none; }
        .glow-a { width: 320px; height: 320px; top: -110px; left: -90px; background: radial-gradient(circle, #f2b705, transparent 70%); animation: drift1 18s ease-in-out infinite; }
        .glow-b { width: 280px; height: 280px; bottom: -90px; right: -70px; background: radial-gradient(circle, #c98a1a, transparent 70%); animation: drift2 22s ease-in-out infinite; }
        @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px, 50px); } }
        @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px, -40px); } }
        @keyframes riseIn { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }

        .wrap { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; padding: 30px 18px 60px; }

        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; animation: riseIn 0.7s ease-out both; }
        .brand img { width: 46px; height: 46px; object-fit: cover; border-radius: 10px; box-shadow: 0 6px 18px rgba(242,183,5,0.25); }
        .brand h1 {
            font-size: 19px; font-weight: 800;
            background: linear-gradient(90deg, #f2b705, #ffd166); -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .sub { font-size: 11.5px; color: #a68a55; margin: 2px 0 26px 58px; }

        /* ---- Login gate ---- */
        #loginBox {
            max-width: 340px; margin: 70px auto; text-align: center;
            background: rgba(20,14,4,0.55); backdrop-filter: blur(14px);
            border: 1px solid rgba(242,183,5,0.22); border-radius: 22px; padding: 32px 26px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55); animation: riseIn 0.8s ease-out both;
        }
        #loginBox img { width: 64px; height: 64px; object-fit: cover; border-radius: 14px; margin-bottom: 14px; box-shadow: 0 8px 22px rgba(242,183,5,0.3); }
        #loginBox p { font-size: 11.5px; color: #a68a55; margin-bottom: 6px; }
        #loginBox input {
            width: 100%; padding: 13px 14px; margin: 14px 0 4px; border-radius: 10px;
            border: 1px solid rgba(242,183,5,0.3); background: rgba(10,6,0,0.55); color: #fff; font-size: 15px; outline: none;
        }
        #loginBox input:focus { border-color: #f2b705; }
        #loginBox button, .btn {
            background: linear-gradient(135deg, #f2b705, #b8860b); color: #1a1200; border: none;
            padding: 12px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        .btn.secondary { background: rgba(242,183,5,0.1); color: #f2b705; border: 1px solid rgba(242,183,5,0.35); }
        #loginErr { color: #ff8080; font-size: 12px; margin-top: 10px; min-height: 16px; }
        .secure-note { font-size: 10px; color: #7a6a45; margin-top: 16px; }

        /* ---- Dashboard ---- */
        #dash { display: none; }
        .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 26px; animation: riseIn 0.8s ease-out 0.1s both; }
        .stat-card {
            background: rgba(20,14,4,0.55); border: 1px solid rgba(242,183,5,0.2); border-radius: 14px;
            padding: 14px 8px; text-align: center;
        }
        .stat-card b { display: block; font-size: 18px; font-weight: 800; color: #f2b705; }
        .stat-card span { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.5px; color: #a68a55; margin-top: 3px; }

        section { margin-bottom: 30px; animation: riseIn 0.9s ease-out 0.15s both; }
        section h2 { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #d8b45a; margin-bottom: 12px; }

        .session-card {
            background: rgba(20,14,4,0.5); border: 1px solid rgba(242,183,5,0.18); border-radius: 14px;
            padding: 16px; margin-bottom: 12px;
        }
        .session-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .session-id { font-size: 11px; color: #a68a55; word-break: break-all; }
        .session-label { font-size: 14px; font-weight: 700; color: #f3e6cf; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .dot.on { background: #ffd166; box-shadow: 0 0 6px #ffd166; }
        .dot.off { background: #6b5a3a; }
        .session-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
        .session-row input[type=text] {
            flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(242,183,5,0.25);
            background: rgba(10,6,0,0.5); color: #fff; font-size: 12.5px; outline: none;
        }
        .toggle-chip {
            font-size: 11px; padding: 6px 10px; border-radius: 20px; cursor: pointer; user-select: none;
            border: 1px solid rgba(242,183,5,0.3); color: #d8c49a; background: rgba(242,183,5,0.06);
        }
        .toggle-chip.active { background: linear-gradient(135deg,#f2b705,#b8860b); color: #1a1200; border-color: transparent; font-weight: 700; }
        .empty { color: #a68a55; font-size: 13px; padding: 20px; text-align: center; }

        .broadcast-box {
            background: rgba(20,14,4,0.5); border: 1px solid rgba(242,183,5,0.18); border-radius: 14px; padding: 18px;
        }
        .broadcast-box select, .broadcast-box input, .broadcast-box textarea {
            width: 100%; padding: 10px 12px; margin-top: 8px; border-radius: 8px; border: 1px solid rgba(242,183,5,0.25);
            background: rgba(10,6,0,0.5); color: #fff; font-size: 13px; outline: none; font-family: inherit;
        }
        .broadcast-box textarea { min-height: 70px; resize: vertical; }
        .broadcast-box label { font-size: 11px; color: #a68a55; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-top: 14px; }
        #broadcastMsg { font-size: 12px; margin-top: 10px; min-height: 16px; }
        .refresh-hint { font-size: 10.5px; color: #7a6a45; text-align: center; margin-top: 8px; }
        .topbar { display: flex; justify-content: flex-end; margin-bottom: -10px; }
    </style>
</head>
<body>
    <div class="backdrop"></div>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <div class="wrap">
        <div id="loginBox">
            <img src="https://i.ibb.co/21PLPr29/file-00000000019082118137012f9eb9753e.png" alt="NIMAH MD">
            <p>Admin Panel</p>
            <input type="password" id="pwInput" placeholder="Admin password">
            <button class="btn" onclick="doLogin()" style="width:100%;">Log In</button>
            <div id="loginErr"></div>
            <div class="secure-note">🔒 Lockout after 5 failed attempts · Token-based session</div>
        </div>

        <div id="dash">
            <div class="topbar"><button class="btn secondary" onclick="logout()">Log Out</button></div>
            <div class="brand">
                <img src="https://i.ibb.co/21PLPr29/file-00000000019082118137012f9eb9753e.png" alt="NIMAH MD">
                <h1>NIMAH MD</h1>
            </div>
            <div class="sub">Admin Panel — every bot paired through this deployment</div>

            <div class="stat-strip" id="statStrip"></div>

            <section>
                <h2>Paired Bots</h2>
                <div id="sessionList"></div>
                <div class="refresh-hint">Refreshes automatically every 8s</div>
            </section>

            <section>
                <h2>Send a Message</h2>
                <div class="broadcast-box">
                    <label>From bot</label>
                    <select id="bSession"></select>
                    <label>To (chat JID — e.g. 94771234567@s.whatsapp.net or a group JID)</label>
                    <input type="text" id="bJid" placeholder="94771234567@s.whatsapp.net">
                    <label>Message</label>
                    <textarea id="bText" placeholder="Type your message..."></textarea>
                    <button class="btn" style="margin-top:14px;" onclick="sendBroadcast()">Send</button>
                    <div id="broadcastMsg"></div>
                </div>
            </section>

            <section>
                <h2>Custom Commands <span style="font-size:10px;color:#7a6a45;text-transform:none;letter-spacing:0;">— no code needed</span></h2>
                <div class="broadcast-box">
                    <label>Command name (without the dot)</label>
                    <input type="text" id="ccName" placeholder="e.g. rules">
                    <label>Reply text</label>
                    <textarea id="ccReply" placeholder="What the bot should say when someone types this command..."></textarea>
                    <button class="btn" style="margin-top:14px;" onclick="addCustomCommand()">Add Command</button>
                    <div id="ccMsg"></div>
                </div>
                <div id="ccList" style="margin-top:12px;"></div>
            </section>
        </div>
    </div>

    <script>
        let adminToken = localStorage.getItem('nimah_admin_token') || '';

        async function doLogin() {
            const pw = document.getElementById('pwInput').value;
            const err = document.getElementById('loginErr');
            err.innerText = '';
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw })
                });
                const data = await res.json();
                if (!res.ok) { err.innerText = data.error || 'Login failed.'; return; }
                adminToken = data.token;
                localStorage.setItem('nimah_admin_token', adminToken);
                showDash();
            } catch (e) { err.innerText = 'Server connection error.'; }
        }

        function adminFetch(url, opts) {
            opts = opts || {};
            opts.headers = Object.assign({ 'x-admin-token': adminToken, 'Content-Type': 'application/json' }, opts.headers || {});
            return fetch(url, opts);
        }

        function showDash() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dash').style.display = 'block';
            refreshAll();
            setInterval(refreshAll, 8000);
        }

        async function refreshAll() {
            await Promise.all([refreshStats(), refreshSessions(), refreshCustomCommands()]);
        }

        async function refreshCustomCommands() {
            const res = await adminFetch('/api/admin/custom-commands');
            if (res.status === 401) return logout();
            const data = await res.json();
            const list = document.getElementById('ccList');
            if (!data.commands.length) { list.innerHTML = ''; return; }
            list.innerHTML = data.commands.map(c => `
                <div class="session-card">
                    <div class="session-top">
                        <div>
                            <span class="session-label">.${escapeHtml(c.name)}</span>
                            <div class="session-id">${escapeHtml(c.reply.slice(0, 80))}${c.reply.length > 80 ? '…' : ''}</div>
                        </div>
                        <button class="btn secondary" onclick="deleteCustomCommand('${c.name}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function addCustomCommand() {
            const name = document.getElementById('ccName').value.trim();
            const reply = document.getElementById('ccReply').value.trim();
            const msg = document.getElementById('ccMsg');
            msg.style.color = '#d8c49a'; msg.innerText = 'Adding...';
            try {
                const res = await adminFetch('/api/admin/custom-commands', { method: 'POST', body: JSON.stringify({ name, reply }) });
                const data = await res.json();
                if (!res.ok) { msg.style.color = '#ff8080'; msg.innerText = data.error || 'Failed to add.'; return; }
                msg.style.color = '#4ade80'; msg.innerText = `Added .${data.name}!`;
                document.getElementById('ccName').value = '';
                document.getElementById('ccReply').value = '';
                refreshCustomCommands();
            } catch (e) { msg.style.color = '#ff8080'; msg.innerText = 'Server connection error.'; }
        }

        async function deleteCustomCommand(name) {
            if (!confirm('Delete .' + name + '?')) return;
            await adminFetch('/api/admin/custom-commands/' + name, { method: 'DELETE' });
            refreshCustomCommands();
        }

        async function refreshStats() {
            const res = await adminFetch('/api/admin/stats');
            if (res.status === 401) return logout();
            const data = await res.json();
            document.getElementById('statStrip').innerHTML = `
                <div class="stat-card"><b>${data.active}</b><span>Active</span></div>
                <div class="stat-card"><b>${data.total}</b><span>Total Sessions</span></div>
                <div class="stat-card"><b>${data.commands}+</b><span>Commands</span></div>
                <div class="stat-card"><b>${data.memoryMb}MB</b><span>Memory</span></div>
            `;
        }

        let lastSessions = [];
        async function refreshSessions() {
            const res = await adminFetch('/api/admin/sessions');
            if (res.status === 401) return logout();
            const data = await res.json();
            lastSessions = data.sessions;
            const list = document.getElementById('sessionList');
            const bSel = document.getElementById('bSession');
            if (!data.sessions.length) {
                list.innerHTML = '<div class="empty">No bots paired yet — share the pairing link to get started.</div>';
                bSel.innerHTML = '<option value="">No bots available</option>';
                return;
            }
            list.innerHTML = data.sessions.map(s => `
                <div class="session-card">
                    <div class="session-top">
                        <div>
                            <span class="dot ${s.connected ? 'on' : 'off'}"></span>
                            <span class="session-label">${s.label ? escapeHtml(s.label) : 'Unnamed bot'}</span>
                            <div class="session-id">${s.id}</div>
                        </div>
                        <button class="btn secondary" onclick="restartSession('${s.id}')">Restart</button>
                    </div>
                    <div class="session-row">
                        <input type="text" placeholder="Give this bot a label..." value="${s.label ? escapeHtml(s.label) : ''}" id="label-${s.id}">
                        <button class="btn secondary" onclick="saveLabel('${s.id}')">Save</button>
                    </div>
                    <div class="session-row">
                        <span class="toggle-chip ${s.autoStatus.view ? 'active' : ''}" onclick="toggleAuto('${s.id}','view',${!s.autoStatus.view})">👁️ Status View</span>
                        <span class="toggle-chip ${s.autoStatus.react ? 'active' : ''}" onclick="toggleAuto('${s.id}','react',${!s.autoStatus.react})">${s.autoStatus.emoji} Status React</span>
                    </div>
                </div>
            `).join('');
            bSel.innerHTML = data.sessions.map(s => `<option value="${s.id}">${s.label ? escapeHtml(s.label) : s.id.slice(0, 8)} ${s.connected ? '(online)' : '(offline)'}</option>`).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        async function toggleAuto(id, field, value) {
            const body = {}; body[field] = value;
            await adminFetch('/api/admin/sessions/' + id + '/autostatus', { method: 'POST', body: JSON.stringify(body) });
            refreshSessions();
        }

        async function saveLabel(id) {
            const label = document.getElementById('label-' + id).value;
            await adminFetch('/api/admin/sessions/' + id + '/label', { method: 'POST', body: JSON.stringify({ label }) });
            refreshSessions();
        }

        async function restartSession(id) {
            if (!confirm('Restart this bot? It will briefly disconnect.')) return;
            await adminFetch('/api/admin/sessions/' + id + '/restart', { method: 'POST' });
            refreshSessions();
        }

        async function sendBroadcast() {
            const sessionId = document.getElementById('bSession').value;
            const jid = document.getElementById('bJid').value.trim();
            const text = document.getElementById('bText').value.trim();
            const msgEl = document.getElementById('broadcastMsg');
            msgEl.style.color = '#d8c49a';
            msgEl.innerText = 'Sending...';
            try {
                const res = await adminFetch('/api/admin/broadcast', {
                    method: 'POST', body: JSON.stringify({ sessionId, jid, text })
                });
                const data = await res.json();
                if (!res.ok) { msgEl.style.color = '#ff8080'; msgEl.innerText = data.error || 'Failed to send.'; return; }
                msgEl.style.color = '#4ade80';
                msgEl.innerText = 'Sent!';
                document.getElementById('bText').value = '';
            } catch (e) { msgEl.style.color = '#ff8080'; msgEl.innerText = 'Server connection error.'; }
        }

        async function logout() {
            try { await adminFetch('/api/admin/logout', { method: 'POST' }); } catch (e) {}
            localStorage.removeItem('nimah_admin_token');
            location.reload();
        }

        if (adminToken) showDash();
        document.getElementById('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
