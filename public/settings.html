<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIMAH MD — My bot</title>
<link rel="icon" href="/logo.jpg">
<link rel="stylesheet" href="/ui.css?v=3">
<style>
  .wrap { max-width: 460px; margin: 4vh auto 0; }
  #panel { display: none; }
  .who-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px dashed var(--line); }
  .who-line .t { font-family: var(--serif); font-size: 22px; color: var(--paper); }
  .who-line .s { font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--mute); }
  .ticks { margin-top: 8px; display: grid; gap: 2px; }
  .ticks .tick { padding: 11px 0; border-bottom: 1px dashed var(--line-soft); justify-content: space-between; flex-direction: row-reverse; }
  .ticks .tick b { margin-right: auto; }
  .legal { margin-top: 18px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #5f563f; }
</style>
</head>
<body>
<div class="page">
  <header class="mast rise">
    <div class="name"><small>Your own bot</small>NIMAH MD</div>
    <div class="meta">Settings<br>Personal</div>
  </header>

  <div class="wrap">
    <!-- ---------- sign in ---------- -->
    <div class="sheet rise d1" id="loginBox">
      <div class="eyebrow">Sign in</div>
      <h1 class="display" style="font-size:34px">Open your <em>settings</em>.</h1>
      <svg class="squiggle" viewBox="0 0 190 12" fill="none" aria-hidden="true"><path d="M2 8 C 14 2, 22 12, 36 6 S 60 3, 74 8 S 100 11, 116 5 S 150 3, 188 7" stroke="#e6b012" stroke-width="2.4" stroke-linecap="round"/></svg>
      <p class="lede">Use the number and password the bot sent to your own WhatsApp when it connected.</p>
      <label class="f" for="phoneInput">WhatsApp number</label>
      <input class="in" type="text" id="phoneInput" inputmode="numeric" placeholder="947XXXXXXXX" autocomplete="username">
      <label class="f" for="pwInput">Password</label>
      <input class="in" type="password" id="pwInput" placeholder="from your WhatsApp" autocomplete="current-password">
      <button class="btn block" onclick="doLogin()">Sign in</button>
      <div class="msg bad" id="err"></div>
      <div class="legal">Shows only your own bot</div>
    </div>

    <!-- ---------- panel ---------- -->
    <div class="sheet" id="panel">
      <div class="who-line">
        <div><div class="s">Your bot</div><div class="t" id="botName">Bot</div></div>
        <span class="stamp" id="stamp">Checking</span>
      </div>

      <label class="f" for="labelInput">Bot label</label>
      <input class="in" type="text" id="labelInput" placeholder="Give your bot a name">
      <button class="btn quiet" style="margin-top:14px" onclick="saveLabel()">Save label</button>

      <label class="f">Auto status</label>
      <div class="ticks">
        <span class="tick" id="viewChip" onclick="toggleField('view')"><i></i>View statuses <b>off</b></span>
        <span class="tick" id="reactChip" onclick="toggleField('react')"><i></i>React to statuses <b>off</b></span>
      </div>

      <div class="msg" id="saveMsg"></div>
      <button class="btn quiet" onclick="logout()" style="margin-top:14px">Sign out</button>
    </div>
  </div>

  <div class="foot">Built by <b>Nimah Dev</b> &middot; 2026</div>
</div>

<script>
  let creds = JSON.parse(localStorage.getItem('nimah_user_creds') || 'null');
  let me = null, meTimer = null;

  function authFetch(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'x-user-phone': creds.phone, 'x-user-password': creds.password, 'Content-Type': 'application/json' }, opts.headers || {});
    return fetch(url, opts);
  }

  async function doLogin() {
    const phone = document.getElementById('phoneInput').value.trim();
    const password = document.getElementById('pwInput').value.trim();
    const err = document.getElementById('err');
    err.innerText = '';
    if (location.protocol !== 'http:' && location.protocol !== 'https:') {
      err.innerText = 'Open this page from its real web link, not a downloaded file.';
      return;
    }
    try {
      const res = await fetch('/api/user/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, password }) });
      const data = await res.json();
      if (!res.ok) { err.innerText = data.error || 'Login failed.'; return; }
      creds = { phone, password };
      localStorage.setItem('nimah_user_creds', JSON.stringify(creds));
      showPanel();
    } catch (e) { err.innerText = 'Server connection error.'; }
  }

  function setTick(id, on) {
    const el = document.getElementById(id);
    el.className = 'tick' + (on ? ' on' : '');
    el.querySelector('b').innerText = on ? 'on' : 'off';
  }

  async function loadMe() {
    const res = await authFetch('/api/user/me');
    if (res.status === 401) return logout();
    me = await res.json();
    const st = document.getElementById('stamp');
    st.className = 'stamp ' + (me.connected ? 'live' : 'down');
    st.innerText = me.connected ? 'Connected' : 'Offline';
    document.getElementById('botName').innerText = me.label || 'Unnamed bot';
    const input = document.getElementById('labelInput');
    if (document.activeElement !== input) input.value = me.label || '';
    setTick('viewChip', !!me.autoStatus.view);
    setTick('reactChip', !!me.autoStatus.react);
  }

  function showPanel() {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadMe();
    if (meTimer) clearInterval(meTimer);
    meTimer = setInterval(loadMe, 10000);
  }

  async function saveLabel() {
    const label = document.getElementById('labelInput').value;
    const msg = document.getElementById('saveMsg');
    await authFetch('/api/user/label', { method: 'POST', body: JSON.stringify({ label }) });
    msg.className = 'msg ok'; msg.innerText = 'Saved';
    setTimeout(() => { msg.innerText = ''; }, 2000);
    loadMe();
  }

  async function toggleField(field) {
    const newVal = !me.autoStatus[field];
    await authFetch('/api/user/autostatus', { method: 'POST', body: JSON.stringify({ [field]: newVal }) });
    loadMe();
  }

  function logout() {
    localStorage.removeItem('nimah_user_creds');
    location.reload();
  }

  document.getElementById('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  if (creds) showPanel();
</script>
</body>
</html>
